name: Release

# Builds release attachments for Windows and Linux. Create and publish a
# GitHub release (or run this workflow manually) and the platform bundles
# are built and attached to that release. The release's title and
# description are never modified; only assets are uploaded.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: deb appimage
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify manifest versions and tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value

          if ($packageVersion -ne $tauriVersion -or $cargoVersion -ne $tauriVersion) {
            throw "Version mismatch: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$tauriVersion") {
            throw "Tag ${{ github.ref_name }} does not match app version v$tauriVersion"
          }

      - name: Build release bundles
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Collect bundle artifacts
        shell: bash
        run: |
          # A dedicated staging directory: dist/ is Vite's output dir and must
          # never be uploaded — its files/dirs made `gh release upload`
          # fail (and junk reached the v0.2.3 release).
          mkdir -p release-assets
          found=false
          for f in \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -e "$f" ]; then
              cp "$f" release-assets/
              found=true
            fi
          done
          if [ "$found" != "true" ]; then
            echo "No bundles found" >&2
            exit 1
          fi
          ls -l release-assets

      - name: Upload assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          echo "Uploading to release $TAG"
          # Upload only known installer extensions — never a bare glob.
          gh release upload "$TAG" \
            release-assets/*.exe \
            release-assets/*.deb \
            release-assets/*.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber
