name: Release

# Builds the app on every platform and attaches the installers to a GitHub
# release. Trigger it by pushing a version tag:
#   git tag v0.1.0
#   git push origin v0.1.0
# The tag MUST match the `version` in src-tauri/tauri.conf.json
# (tauri-action substitutes __VERSION__ from there).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Windows only: the capture gestures (double-shift hook) are Windows-specific.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Pocket v__VERSION__"
          releaseBody: "Installers for Pocket v__VERSION__. Pick the file for your OS."
          releaseDraft: false
          prerelease: false

      - name: Upload bundles as workflow artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: pocket-windows
          path: src-tauri/target/release/bundle/
