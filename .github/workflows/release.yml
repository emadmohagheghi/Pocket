name: Release

# Builds release attachments for Windows and Linux. Create and publish a
# GitHub release (or run this workflow manually) and the platform bundles
# are built and attached to that release.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: deb appimage
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify manifest versions and tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value

          if ($packageVersion -ne $tauriVersion -or $cargoVersion -ne $tauriVersion) {
            throw "Version mismatch: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$tauriVersion") {
            throw "Tag ${{ github.ref_name }} does not match app version v$tauriVersion"
          }

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Pocket v__VERSION__"
          releaseBody: |
            Pocket v__VERSION__ installers.

            Windows: download the attached `setup.exe` and run it to install Pocket for the current user.

            Linux: download the attached `.deb` (Debian/Ubuntu) or `.AppImage` (portable) bundle.

            This build is currently unsigned. Windows SmartScreen may show a warning.
            Code-signing policy: https://github.com/emadmohagheghi/Pocket/blob/master/CODE_SIGNING_POLICY.md
            Privacy policy: https://github.com/emadmohagheghi/Pocket/blob/master/PRIVACY.md
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
