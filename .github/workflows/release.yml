name: Release

# Publish the single supported Windows installer either by pushing a matching
# version tag (for example v0.1.3) or by running this workflow manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify manifest versions and tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value

          if ($packageVersion -ne $tauriVersion -or $cargoVersion -ne $tauriVersion) {
            throw "Version mismatch: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$tauriVersion") {
            throw "Tag ${{ github.ref_name }} does not match app version v$tauriVersion"
          }

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Pocket v__VERSION__"
          releaseBody: |
            Windows x64 installer for Pocket v__VERSION__.

            Download the attached `setup.exe` and run it to install Pocket for the current user.

            This build is currently unsigned. Windows SmartScreen may show a warning.
            Code-signing policy: https://github.com/emadmohagheghi/Pocket/blob/master/CODE_SIGNING_POLICY.md
            Privacy policy: https://github.com/emadmohagheghi/Pocket/blob/master/PRIVACY.md
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
